name: build
# 推送 v* 标签或手动运行：构建 Linux / macOS / Windows 三个安装包（带 logo），标签触发时自动发布到 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, shell: bash }
          - { os: macos-latest, name: macos, shell: bash }
          - { os: windows-latest, name: windows, shell: "msys2 {0}" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - name: Install deps (Windows / MSYS2)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: gcc pkgconf libcurl-devel binutils zip
      - name: Build
        run: |
          mkdir -p build dist
          if [ "$RUNNER_OS" = macOS ]; then LIBS="-lcurl"; else LIBS="$(pkg-config --cflags --libs libcurl)"; fi
          OBJ=""
          if [ "$RUNNER_OS" = Windows ]; then
            echo '1 ICON "assets/cfip.ico"' > build/cfip.rc
            windres build/cfip.rc -O coff -o build/cfip_res.o
            OBJ=build/cfip_res.o
          fi
          cc -O2 -Wall -Wextra -o build/cfip cf_ip_test_tls.c $OBJ $LIBS -lpthread
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          D=dist/cfip; mkdir -p $D
          cp build/cfip install.sh README.md $D/
          cp -r web assets $D/
          tar czf cfip-linux-x64.tar.gz -C dist cfip
      - name: Package (macOS .app)
        if: matrix.name == 'macos'
        run: |
          A=dist/CFIP.app; mkdir -p $A/Contents/MacOS $A/Contents/Resources
          cp build/cfip $A/Contents/MacOS/cfip-bin
          cp -r web $A/Contents/MacOS/web
          cp assets/cfip.icns $A/Contents/Resources/cfip.icns
          cp assets/Info.plist $A/Contents/Info.plist
          printf '#!/bin/bash\ncd "$(dirname "$0")"\nexport CFIP_HOME="$HOME/Library/Application Support/CFIP"\nmkdir -p "$CFIP_HOME"\nexec ./cfip-bin\n' > $A/Contents/MacOS/CFIP
          chmod +x $A/Contents/MacOS/CFIP $A/Contents/MacOS/cfip-bin
          (cd dist && zip -qr ../cfip-macos.zip CFIP.app)
      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          D=dist/cfip; mkdir -p $D
          cp build/cfip.exe $D/
          ldd build/cfip.exe | awk '/\/usr\/bin/ {print $3}' | xargs -I{} cp {} $D/
          cp -r web assets $D/
          printf '@echo off\r\ncd /d "%%~dp0"\r\ncfip.exe\r\n' > $D/Start-CFIP.bat
          (cd dist && zip -qr ../cfip-windows.zip cfip)
      - uses: actions/upload-artifact@v4
        with:
          name: cfip-${{ matrix.name }}
          path: cfip-*.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cfip-*.*

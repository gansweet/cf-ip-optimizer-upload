name: android
# 推送 v* 标签或手动运行：构建可直接安装的安卓 APK（调试签名，可侧载安装）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Collect
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cfip-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cfip-android-apk
          path: cfip-android.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cfip-android.apk

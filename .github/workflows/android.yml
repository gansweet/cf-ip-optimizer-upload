name: android
# 推送 v* 标签或手动运行：构建可直接安装的安卓 APK（调试签名，可侧载安装）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 升级到 setup-java@v5 消除旧版本警告
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 手动配置 Android SDK，避开冲突的第三方 Action
      - name: Set up Android SDK
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools

          echo "Downloading Android Command Line Tools..."
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o commandlinetools.zip
          unzip -q commandlinetools.zip

          # 调整目录结构以符合 sdkmanager 规范
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          rm commandlinetools.zip

          # 写入环境变量和 PATH
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      # 自动接受所有 SDK 许可证并安装基础工具
      - name: Accept Android SDK Licenses & Install Tools
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Collect
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cfip-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cfip-android-apk
          path: cfip-android.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cfip-android.apk
